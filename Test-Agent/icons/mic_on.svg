<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="30" stroke="#78B4FF" stroke-width="4"/>

  <!-- Microphone body -->
  <rect x="28" y="18" width="8" height="22" rx="4" fill="#78B4FF"/>

  <!-- Short curved side frames (shock mount) -->
  <path d="M24,20 Q24,29 28,30" stroke="#78B4FF" stroke-width="2" fill="none"/>
  <path d="M40,20 Q40,29 36,30" stroke="#78B4FF" stroke-width="2" fill="none"/>

  <!-- Microphone foot -->
  <line x1="32" y1="40" x2="32" y2="46" stroke="#78B4FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="46" x2="36" y2="46" stroke="#78B4FF" stroke-width="3" stroke-linecap="round"/>
</svg>
